name: refresh nameservers

# Deliberately independent of the test workflow. A lint failure must never block the
# data refresh: a stale resolver list still probes healthy, so nobody notices it rotted.

on:
  schedule:
    - cron: "0 6 * * 0"
  push:
    paths:
      - suspects.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-nameservers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Rebuild nameservers.txt (pool seed + suspects.txt)
        run: uv run refresh-nameservers | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit if the list changed
        run: |
          if git diff --quiet -- nameservers.txt; then
            echo "no change to nameservers.txt, not committing"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nameservers.txt nameservers.meta.json
          git commit -m "refresh nameservers.txt ($(wc -l < nameservers.txt | tr -d ' ') resolvers)"
          git push
